# ========================================
# Docker Compose — Project Core
# ========================================
# Запуск: docker compose up -d
# Остановка: docker compose down

services:
  # База данных MongoDB
  mongodb:
    image: mongo:8
    container_name: kppdf-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: project-core
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.runCommand(\"ping\").ok' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ChromaDB — векторная БД для семантического поиска
  chromadb:
    image: chromadb/chroma:latest
    container_name: kppdf-chromadb
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - chromadb_data:/chroma/chroma
    environment:
      IS_PERSISTENT: "TRUE"
      ANONYMIZED_TELEMETRY: "FALSE"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8000/api/v2/heartbeat || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Backend (Express)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kppdf-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - mongodb
    volumes:
      - backend_uploads:/app/uploads
    env_file:
      - ./backend/.env
    environment:
      MONGODB_URI: mongodb://mongodb:27017/project-core
      NODE_ENV: production

volumes:
  mongodb_data:
    name: kppdf-mongodb-data
  chromadb_data:
    name: kppdf-chromadb-data
  backend_uploads:
    name: kppdf-uploads
