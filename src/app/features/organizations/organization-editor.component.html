<kp-toast />

<kp-card styleClass="org-editor">
  <kp-breadcrumb [items]="breadcrumbs" />

  <h2 class="org-editor__title">
    {{ isNew() ? 'Новая организация' : 'Редактирование организации' }}
  </h2>

  @if (loading()) {
    <div class="org-editor__loading">Загрузка...</div>
  } @else {
    <!-- Основные данные -->
    <fieldset class="org-editor__section">
      <legend class="org-editor__section-title">Основные данные</legend>

      <div class="org-editor__row">
        <div class="org-editor__field org-editor__field--wide">
          <kp-input
            label="Полное наименование"
            placeholder="ООО «Название компании»"
            [(ngModel)]="name"
            [error]="nameError()"
          />
        </div>
        <div class="org-editor__field">
          <kp-input
            label="Краткое наименование"
            placeholder="ООО «Название»"
            [(ngModel)]="shortName"
          />
        </div>
      </div>

      <div class="org-editor__row">
        <div class="org-editor__field org-editor__field--compact">
          <kp-select
            label="ОПФ"
            placeholder="Выберите форму"
            [options]="legalFormOptions"
            [ngModel]="legalForm()"
            (ngModelChange)="legalForm.set($event)"
          />
        </div>
        <div class="org-editor__field org-editor__field--compact">
          <kp-input
            label="ИНН"
            placeholder="10 или 12 цифр"
            [(ngModel)]="inn"
            [error]="innError()"
          />
        </div>
        <div class="org-editor__field org-editor__field--compact">
          <kp-input
            label="КПП"
            placeholder="9 цифр"
            [(ngModel)]="kpp"
          />
        </div>
        <div class="org-editor__field org-editor__field--compact">
          <kp-input
            label="ОГРН"
            placeholder="13 цифр"
            [(ngModel)]="ogrn"
          />
        </div>
      </div>
    </fieldset>

    <!-- Контакты -->
    <fieldset class="org-editor__section">
      <legend class="org-editor__section-title">Контакты</legend>

      <div class="org-editor__row">
        <div class="org-editor__field">
          <kp-input
            label="Телефон"
            placeholder="+7 (495) 123-45-67"
            [(ngModel)]="phone"
          />
        </div>
        <div class="org-editor__field">
          <kp-input
            label="Email"
            placeholder="info@company.ru"
            [(ngModel)]="email"
          />
        </div>
      </div>

      <div class="org-editor__row">
        <div class="org-editor__field org-editor__field--wide">
          <kp-input
            label="Юридический адрес"
            placeholder="125009, г. Москва, ул. Тверская, д. 12"
            [(ngModel)]="legalAddress"
          />
        </div>
      </div>

      <div class="org-editor__row">
        <div class="org-editor__field org-editor__field--wide">
          <kp-input
            label="Почтовый адрес"
            placeholder="125009, г. Москва, а/я 45"
            [(ngModel)]="postalAddress"
          />
        </div>
      </div>
    </fieldset>

    <!-- Банковские реквизиты -->
    <fieldset class="org-editor__section">
      <legend class="org-editor__section-title">Банковские реквизиты</legend>

      <div class="org-editor__row">
        <div class="org-editor__field org-editor__field--wide">
          <kp-input
            label="Банк"
            placeholder="ПАО «Сбербанк»"
            [(ngModel)]="bankName"
          />
        </div>
      </div>

      <div class="org-editor__row">
        <div class="org-editor__field org-editor__field--compact">
          <kp-input
            label="БИК"
            placeholder="9 цифр"
            [(ngModel)]="bankBik"
          />
        </div>
        <div class="org-editor__field">
          <kp-input
            label="Расчётный счёт"
            placeholder="20 цифр"
            [(ngModel)]="bankAccount"
          />
        </div>
      </div>
    </fieldset>

    <!-- Подписанты -->
    <fieldset class="org-editor__section">
      <legend class="org-editor__section-title">Подписант</legend>

      <div class="org-editor__row">
        <div class="org-editor__field">
          <kp-input
            label="ФИО подписанта"
            placeholder="Иванов Иван Иванович"
            [(ngModel)]="signerName"
          />
        </div>
        <div class="org-editor__field">
          <kp-input
            label="Должность"
            placeholder="Генеральный директор"
            [(ngModel)]="signerPosition"
          />
        </div>
      </div>
    </fieldset>

    <!-- Статус -->
    <div class="org-editor__status">
      <div class="org-editor__status-row">
        <kp-toggle
          [(ngModel)]="isActive"
          label="Организация активна"
        />
      </div>
    </div>

    <!-- Футер -->
    <div class="org-editor__footer">
      <kp-button
        [label]="isNew() ? 'Создать организацию' : 'Сохранить'"
        icon="pi pi-check"
        [loading]="saving()"
        (buttonClick)="save()"
      />
      <kp-button
        label="Отмена"
        icon="pi pi-times"
        severity="secondary"
        (buttonClick)="cancel()"
      />
    </div>
  }
</kp-card>
