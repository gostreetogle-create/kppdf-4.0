<kp-toast />
<kp-confirm-dialog />

<kp-card>
  <kp-breadcrumb [items]="breadcrumbs" />

  <div class="org-list__header">
    <h2 class="org-list__title">Контрагенты</h2>
    <kp-button
      label="Добавить контрагента"
      lucideIcon="plus"
      routerLink="/references/organizations/new"
    />
  </div>

  <!-- Табы по ролям -->
  <div class="org-list__tabs" role="tablist">
    @for (tab of tabs(); track tab.id) {
      <button
        class="org-list__tab"
        [class.org-list__tab--active]="activeTab() === tab.id"
        role="tab"
        [attr.aria-selected]="activeTab() === tab.id"
        (click)="onTabChange(tab.id)"
      >
        {{ tab.label }}
        <span class="org-list__tab-count">{{ tab.count }}</span>
      </button>
    }
  </div>

  <kp-table
    [data]="organizations()"
    [columns]="tableColumns"
    [rows]="20"
    [paginator]="true"
    [loading]="loading()"
    [sortField]="'name'"
    [sortOrder]="1"
    [searchFields]="['name', 'shortName', 'inn', 'email', 'contactPerson']"
    [emptyMessage]="activeTab() === 'supplier' ? 'Нет поставщиков' : activeTab() === 'buyer' ? 'Нет покупателей' : 'Нет контрагентов'"
    (rowEdit)="onEditRow($event)"
    (rowDelete)="onDelete($event)"
  />
</kp-card>
