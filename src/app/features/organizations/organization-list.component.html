<kp-toast />
<kp-confirm-dialog />

<kp-card>
  <kp-breadcrumb [items]="breadcrumbs" />

  <div class="org-list__header">
    <h2 class="org-list__title">Организации</h2>
    <kp-button
      label="Добавить организацию"
      icon="pi pi-plus"
      routerLink="/references/organizations/new"
    />
  </div>

  <kp-table
    [data]="organizations()"
    [columns]="tableColumns"
    [rows]="20"
    [paginator]="true"
    [loading]="loading()"
    [sortField]="'name'"
    [sortOrder]="1"
    [searchFields]="['name', 'shortName', 'inn', 'email']"
    emptyMessage="Нет организаций"
    (rowEdit)="onEditRow($event)"
    (rowDelete)="onDelete($event)"
  />
</kp-card>
