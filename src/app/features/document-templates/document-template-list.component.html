<kp-toast />
<kp-confirm-dialog />

<!-- Preview dialog (загружается, когда браузер свободен) -->
@defer (on idle) {
  <kp-doc-preview-dialog />
}

<kp-card>
  <kp-breadcrumb [items]="breadcrumbs" />

  <div class="dt-list__header">
    <h2 class="dt-list__title">Шаблоны документов</h2>
    <kp-button
      label="Создать шаблон"
      lucideIcon="plus"
      routerLink="/admin/document-templates/new"
    />
  </div>

  <kp-table
    [data]="templates()"
    [columns]="tableColumns"
    [rows]="20"
    [paginator]="true"
    [loading]="loading()"
    [sortField]="'name'"
    [sortOrder]="1"
    [searchFields]="['name']"
    [showClone]="true"
    [showView]="true"
    emptyMessage="Нет созданных шаблонов документов"
    (rowView)="onViewRow($event)"
    (rowEdit)="onEditRow($event)"
    (rowClone)="onClone($event)"
    (rowDelete)="onDelete($event)"
  />
</kp-card>
