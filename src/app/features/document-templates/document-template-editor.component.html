<kp-toast />

<!-- Text editor dialog -->
<kp-doc-text-editor-dialog (saved)="onTextBlockSave($event)" />

<!-- Preview dialog -->
<kp-doc-preview-dialog />

<!-- Table block editor dialog -->
<kp-dialog
  header="Редактирование табличного блока"
  [visible]="tableEditVisible()"
  (visibleChange)="onTableEditDialogClose($event)"
  width="500px"
>
  <div class="dt-editor__table-edit">
    <div class="dt-editor__field">
      <kp-input
        label="Заголовок таблицы"
        placeholder="Например: Спецификация товаров"
        [(ngModel)]="editingTableTitle"
      />
    </div>
    <div class="dt-editor__field">
      <kp-select
        label="Шаблон таблицы"
        placeholder="Выберите шаблон"
        [options]="tableTemplateOptions()"
        [ngModel]="editingTableTemplateId()"
        (ngModelChange)="editingTableTemplateId.set($event)"
      />
    </div>
    <div class="dt-editor__table-edit-footer">
      <kp-button
        label="Сохранить"
        icon="pi pi-check"
        (buttonClick)="saveTableBlockEdit()"
      />
      <kp-button
        label="Отмена"
        icon="pi pi-times"
        severity="secondary"
        (buttonClick)="tableEditVisible.set(false)"
      />
    </div>
  </div>
</kp-dialog>

<kp-card styleClass="dt-editor">
  <kp-breadcrumb [items]="breadcrumbs" />

  <h2 class="dt-editor__title">
    {{ isNew() ? 'Новый шаблон документа' : 'Редактирование шаблона' }}
  </h2>

  @if (loading()) {
    <div class="dt-editor__loading">Загрузка...</div>
  } @else {
    <!-- Layout: левая панель + правый холст A4 -->
    <div class="dt-editor__layout">
      <!-- Левая панель -->
      <div class="dt-editor__sidebar">
        <div class="dt-editor__field">
          <kp-input
            label="Название шаблона"
            placeholder="Например: Коммерческое предложение"
            [(ngModel)]="templateName"
            [error]="nameError()"
          />
        </div>

        <div class="dt-editor__field">
          <kp-select
            label="Тип документа"
            [options]="docTypeOptions"
            [ngModel]="docType()"
            (ngModelChange)="docType.set($event)"
          />
        </div>

        <div class="dt-editor__field">
          <kp-input
            label="Описание"
            placeholder="Необязательное описание шаблона"
            [(ngModel)]="description"
          />
        </div>

        <!-- Тулбар добавления блоков -->
        <div class="dt-editor__toolbar">
          <span class="dt-editor__toolbar-label">Добавить блок:</span>
          <div class="dt-editor__toolbar-buttons">
            <kp-button
              label="+ Текст"
              icon="pi pi-align-left"
              size="small"
              severity="secondary"
              (buttonClick)="addBlock('text')"
            />
            <kp-button
              label="+ Таблица"
              icon="pi pi-table"
              size="small"
              severity="secondary"
              (buttonClick)="addBlock('table')"
            />
            <kp-button
              label="+ Разделитель"
              icon="pi pi-minus"
              size="small"
              severity="secondary"
              (buttonClick)="addBlock('separator')"
            />
          </div>
        </div>

        <!-- Предпросмотр -->
        <div class="dt-editor__preview-btn">
          <kp-button
            label="Предпросмотр"
            icon="pi pi-eye"
            size="small"
            severity="info"
            [disabled]="blocks().length === 0"
            (buttonClick)="preview()"
          />
        </div>
      </div>

      <!-- Правая часть: A4 Canvas -->
      <div class="dt-editor__canvas-area">
        <kp-doc-canvas
          [blocks]="blocks()"
          [selectedBlockId]="selectedBlockId()"
          (blockSelect)="selectedBlockId.set($event)"
          (blockEdit)="onBlockEdit($event)"
          (blockRemove)="removeBlock($event)"
          (blockMoveUp)="moveBlockUp($event)"
          (blockMoveDown)="moveBlockDown($event)"
          (blocksReorder)="onBlocksReorder($event)"
        />
      </div>
    </div>

    <!-- Футер -->
    <div class="dt-editor__footer">
      <kp-button
        [label]="isNew() ? 'Создать шаблон' : 'Сохранить'"
        icon="pi pi-check"
        [loading]="saving()"
        (buttonClick)="save()"
      />
      <kp-button
        label="Отмена"
        icon="pi pi-times"
        severity="secondary"
        (buttonClick)="cancel()"
      />
    </div>
  }
</kp-card>
