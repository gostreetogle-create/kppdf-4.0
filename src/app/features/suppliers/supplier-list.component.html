<kp-toast />
<kp-confirm-dialog />

<kp-card>
  <kp-breadcrumb [items]="breadcrumbs" />

  <div class="org-list__header">
    <h2 class="org-list__title">Поставщики</h2>
    <kp-button
      label="Добавить поставщика"
      icon="pi pi-plus"
      routerLink="/references/suppliers/new"
    />
  </div>

  <kp-table
    [data]="suppliers()"
    [columns]="tableColumns"
    [rows]="20"
    [paginator]="true"
    [loading]="loading()"
    [sortField]="'name'"
    [sortOrder]="1"
    [searchFields]="['name', 'contactPerson', 'inn', 'email']"
    emptyMessage="Нет поставщиков"
    (rowEdit)="onEditRow($event)"
    (rowDelete)="onDelete($event)"
  />
</kp-card>
