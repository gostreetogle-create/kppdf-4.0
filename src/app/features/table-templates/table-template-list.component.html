<kp-toast />
<kp-confirm-dialog />

<!-- Preview dialog (загружается, когда браузер свободен) -->
@defer (on idle) {
<kp-dialog
  header="Предпросмотр: {{ previewTemplate()?.name || '' }}"
  [(visible)]="previewVisible"
  width="800px"
>
  @if (previewLoading()) {
    <div class="tt-preview__loading">Загрузка...</div>
  } @else if (previewTemplate(); as tmpl) {
    <div class="tt-preview__info">
      <span class="tt-preview__label">{{ tmpl.columns.length }} колонок</span>
      <span class="tt-preview__sep">·</span>
      <span class="tt-preview__label">Таблицы: {{ getTableNames(tmpl) }}</span>
    </div>
    <kp-table
      [data]="previewData()"
      [columns]="previewColumns()"
      [paginator]="false"
      [showActions]="false"
      [resizable]="true"
      storageKey="tt-preview-{{ tmpl.id }}"
    />
    <div class="tt-preview__footer">
      <kp-button
        label="Редактировать"
        lucideIcon="pencil"
        (buttonClick)="onEditRow(previewTemplate()); previewVisible.set(false)"
      />
      <kp-button
        label="Закрыть"
        lucideIcon="x"
        severity="secondary"
        (buttonClick)="previewVisible.set(false)"
      />
    </div>
  }
</kp-dialog>
}

<kp-card>
  <kp-breadcrumb [items]="breadcrumbs" />

  <div class="tt-list__header">
    <h2 class="tt-list__title">Шаблоны таблиц</h2>
    <kp-button
      label="Создать шаблон"
      lucideIcon="plus"
      routerLink="/admin/table-templates/new"
    />
  </div>

  <kp-table
    storageKey="table-templates"
    [data]="templates()"
    [columns]="tableColumns"
    [rows]="20"
    [paginator]="true"
    [loading]="loading()"
    [sortField]="'name'"
    [sortOrder]="1"
    [searchFields]="['name']"
    [showClone]="true"
    [showView]="true"
    emptyMessage="Нет созданных шаблонов"
    (rowView)="onViewRow($event)"
    (rowEdit)="onEditRow($event)"
    (rowClone)="onClone($event)"
    (rowDelete)="onDelete($event)"
  />
</kp-card>
